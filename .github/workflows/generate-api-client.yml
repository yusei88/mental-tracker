name: Generate API Client

on:
    push:
        branches: [main]
        paths:
            - "backend/**"
    pull_request:
        branches: [main]
        paths:
            - "backend/**"

jobs:
    generate-api-client:
        # Only run on push to main branch to avoid creating PRs for PR events
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        env:
            ENV: ci

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install backend dependencies
              working-directory: ./backend
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Generate OpenAPI schema
              working-directory: ./backend
              run: |
                  ENV=ci python generate_openapi.py

            - name: Install OpenAPI Generator CLI
              run: npm install -g @openapitools/openapi-generator-cli

            - name: Generate TypeScript Axios client
              run: |
                  openapi-generator-cli generate \
                    -i ./openapi/schema.json \
                    -g typescript-axios \
                    -o ./frontend/src/api \
                    -c ./openapi-generator-config.json

            - name: Clean up unnecessary generated files
              run: |
                  cd frontend/src/api
                  rm -f .npmignore README.md package.json tsconfig.json tsconfig.esm.json git_push.sh
                  rm -rf docs

            - name: Setup GitHub CLI
              run: |
                  # GitHub CLI is pre-installed on ubuntu-latest, just verify
                  gh --version

            - name: Create branch and commit changes
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  BRANCH_NAME="api-client-update-$(date +'%Y%m%d-%H%M%S')"
                  echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
                  git checkout -b $BRANCH_NAME
                  git add frontend/src/api/ openapi/schema.json
                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                    echo "HAS_CHANGES=false" >> $GITHUB_ENV
                  else
                    git commit -m "Auto-generate API client from schema"
                    git push origin $BRANCH_NAME
                    echo "HAS_CHANGES=true" >> $GITHUB_ENV
                  fi

            - name: Create Pull Request
              if: env.HAS_CHANGES == 'true'
              run: |
                  gh pr create \
                    --title "🤖 Auto-update API client - ${{ env.BRANCH_NAME }}" \
                    --body "## 🔄 API Client Auto-Update

                  This PR was automatically generated by the API client generation workflow.

                  ### Changes
                  - Updated TypeScript Axios client based on latest FastAPI schema
                  - Regenerated type definitions from OpenAPI schema
                  - Updated API endpoint interfaces

                  ### Generated Files
                  - \`frontend/src/api/\` - Updated TypeScript API client
                  - \`openapi/schema.json\` - Updated OpenAPI schema

                  This PR ensures the frontend API client stays synchronized with the backend API changes.

                  ---
                  *Generated automatically on $(date +'%Y-%m-%d %H:%M:%S UTC')*" \
                    --head ${{ env.BRANCH_NAME }} \
                    --base main
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
